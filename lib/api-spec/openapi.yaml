openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Authenticated user profile operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the current application user
      description: Returns the signed-in user's local application profile and role.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/me/consents:
    get:
      operationId: getCurrentUserConsents
      tags: [users]
      summary: Get the current user's optional consent preferences
      security:
        - clerkSession: []
      responses:
        "200":
          description: Optional consent preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConsents"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateCurrentUserConsents
      tags: [users]
      summary: Update the current user's optional consent preferences
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserConsentsUpdate"
      responses:
        "200":
          description: Updated optional consent preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConsents"
        "400":
          description: Invalid consent preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CurrentUser:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [member, admin]
        createdAt:
          type: string
          format: date-time
      required: [userId, role, createdAt]
    UserConsents:
      type: object
      properties:
        analytics:
          type: boolean
        marketing:
          type: boolean
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required: [analytics, marketing, updatedAt]
    UserConsentsUpdate:
      type: object
      properties:
        analytics:
          type: boolean
        marketing:
          type: boolean
      required: [analytics, marketing]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

