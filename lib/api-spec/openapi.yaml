openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Authenticated user profile operations
  - name: consultations
    description: Consent-based consultation request operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the current application user
      description: Returns the signed-in user's local application profile and role.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/me/consents:
    get:
      operationId: getCurrentUserConsents
      tags: [users]
      summary: Get the current user's optional consent preferences
      security:
        - clerkSession: []
      responses:
        "200":
          description: Optional consent preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConsents"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateCurrentUserConsents
      tags: [users]
      summary: Update the current user's optional consent preferences
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserConsentsUpdate"
      responses:
        "200":
          description: Updated optional consent preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConsents"
        "400":
          description: Invalid consent preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/me/consultation-requests:
    get:
      operationId: listMyConsultationRequests
      tags: [consultations]
      summary: List the signed-in user's consultation requests
      security:
        - clerkSession: []
      responses:
        "200":
          description: Consultation requests owned by the signed-in user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyConsultationRequest"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createMyConsultationRequest
      tags: [consultations]
      summary: Submit a consultation request with consent
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationRequestInput"
      responses:
        "201":
          description: Consultation request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyConsultationRequest"
        "400":
          description: Invalid request or required consent missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/consultation-requests:
    get:
      operationId: listAdminConsultationRequests
      tags: [consultations]
      summary: List consultation requests for administrators
      security:
        - clerkSession: []
      responses:
        "200":
          description: Consultation request queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminConsultationRequest"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/consultation-requests/{requestId}:
    patch:
      operationId: updateAdminConsultationRequest
      tags: [consultations]
      summary: Update a consultation request status
      security:
        - clerkSession: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationRequestStatusUpdate"
      responses:
        "200":
          description: Updated consultation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConsultationRequest"
        "400":
          description: Invalid status or request identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Consultation request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CurrentUser:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [member, admin]
        createdAt:
          type: string
          format: date-time
      required: [userId, role, createdAt]
    UserConsents:
      type: object
      properties:
        analytics:
          type: boolean
        marketing:
          type: boolean
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required: [analytics, marketing, updatedAt]
    UserConsentsUpdate:
      type: object
      properties:
        analytics:
          type: boolean
        marketing:
          type: boolean
      required: [analytics, marketing]
    ConsultationRequestStatus:
      type: string
      enum: [received, reviewing, follow_up, closed]
    ConsultationRequestInput:
      type: object
      properties:
        contactEmail:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 254
        purpose:
          type: string
          minLength: 8
          maxLength: 120
        details:
          type: string
          minLength: 20
          maxLength: 2000
        consent:
          type: boolean
      required: [contactEmail, purpose, details, consent]
    ConsultationRequestStatusUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ConsultationRequestStatus"
      required: [status]
    MyConsultationRequest:
      type: object
      properties:
        id:
          type: number
        contactEmail:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        purpose:
          type: string
        details:
          type: string
        status:
          $ref: "#/components/schemas/ConsultationRequestStatus"
        consentedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, contactEmail, purpose, details, status, consentedAt, createdAt, updatedAt]
    AdminConsultationRequest:
      allOf:
        - $ref: "#/components/schemas/MyConsultationRequest"
        - type: object
          properties:
            userId:
              type: string
          required: [userId]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

